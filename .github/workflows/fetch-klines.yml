name: Fetch Binance klines (one-off, for backtest)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download H1 klines 2019 -> now
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, csv, os
          os.makedirs("klines", exist_ok=True)
          start = int(time.mktime(time.strptime("2019-01-01", "%Y-%m-%d")) * 1000)
          for sym in ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"]:
              rows, t = [], start
              while True:
                  url = f"https://data-api.binance.vision/api/v3/klines?symbol={sym}&interval=1h&startTime={t}&limit=1000"
                  for k in range(5):
                      try:
                          data = json.load(urllib.request.urlopen(url, timeout=30)); break
                      except Exception as e:
                          print("retry", sym, e); time.sleep(3)
                  else:
                      raise SystemExit("failed " + sym)
                  if not data: break
                  rows += [[d[0], d[1], d[2], d[3], d[4], d[5]] for d in data]
                  if len(data) < 1000: break
                  t = data[-1][0] + 3600000
                  time.sleep(0.15)
              with open(f"klines/{sym}_1h.csv", "w", newline="") as f:
                  w = csv.writer(f); w.writerow(["open_time", "open", "high", "low", "close", "volume"]); w.writerows(rows)
              print(sym, len(rows), "rows", rows[0][0], rows[-1][0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: klines
          path: klines/
          retention-days: 3
